name: chubbyfish
description: "小渔窝 —— 大肥鱼专属聊天客户端（Windows / Android）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0
  workmanager: ^0.10.10
  record: ^6.1.2
  gal: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/notify.wav
